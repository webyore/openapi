name: Check specification and examples
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: php --version && python3 --version && curl --version
      - run: php -l examples/create-link.php
      - run: npm test
      - run: npm run spec:check
